<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GradeLens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><g fill="#D64027"><path d="M192.095 20.517A64 64 0 1 0 319.905 20.517A244 244 0 0 0 192.095 20.517ZM377.324 44.301A64 64 0 1 0 467.699 134.676A244 244 0 0 0 377.324 44.301ZM491.483 192.095A64 64 0 1 0 491.483 319.905A244 244 0 0 0 491.483 192.095ZM467.699 377.324A64 64 0 1 0 377.324 467.699A244 244 0 0 0 467.699 377.324ZM319.905 491.483A64 64 0 1 0 192.095 491.483A244 244 0 0 0 319.905 491.483ZM134.676 467.699A64 64 0 1 0 44.301 377.324A244 244 0 0 0 134.676 467.699ZM20.517 319.905A64 64 0 1 0 20.517 192.095A244 244 0 0 0 20.517 319.905ZM44.301 134.676A64 64 0 1 0 134.676 44.301A244 244 0 0 0 44.301 134.676Z"/><circle cx="256" cy="132" r="20"/><circle cx="343.681" cy="168.319" r="20"/><circle cx="380" cy="256" r="20"/><circle cx="343.681" cy="343.681" r="20"/><circle cx="256" cy="380" r="20"/><circle cx="168.319" cy="343.681" r="20"/><circle cx="132" cy="256" r="20"/><circle cx="168.319" cy="168.319" r="20"/></g><circle cx="256" cy="256" r="244" fill="none" stroke="#D64027" stroke-width="24"/><path fill="#D64027" fill-rule="evenodd" d="M176 256A80 80 0 1 0 336 256A80 80 0 1 0 176 256ZM202.415 233.804A58 58 0 0 1 233.804 202.415A6 6 0 0 1 238.397 213.502A46 46 0 0 0 213.502 238.397A6 6 0 0 1 202.415 233.804Z"/></svg>
    <div class="titles">
      <h1>GradeLens</h1>
      <p id="origin"></p>
    </div>
    <button id="dark" class="icon-btn hit" data-tip="Dark Canvas" data-tip-pos="below" aria-label="Dark Canvas" aria-pressed="false"></button>
    <button id="accent" class="icon-btn hit" data-tip="Accent color" data-tip-pos="below" aria-label="Accent color" aria-expanded="false" aria-controls="swatches"></button>
    <button id="export" class="icon-btn hit" data-tip="Export CSV" data-tip-pos="below" aria-label="Export all grades as CSV" disabled></button>
    <button id="refresh" class="icon-btn hit" data-tip="Refresh" data-tip-pos="below-end" aria-label="Refresh"></button>
  </header>

  <div id="swatches" class="swatches" role="radiogroup" aria-label="Canvas accent color" hidden></div>

  <section id="summary" class="summary" hidden>
    <div class="stat"><span class="k">Avg</span><span class="v" id="avg">—</span></div>
    <div class="stat"><span class="k">GPA</span><span class="v" id="gpa">—</span></div>
  </section>

  <main id="list" class="list">
    <div class="row skel"><div class="sk w60"></div><div class="sk w20"></div></div>
    <div class="row skel"><div class="sk w50"></div><div class="sk w20"></div></div>
    <div class="row skel"><div class="sk w70"></div><div class="sk w20"></div></div>
  </main>

  <script src="../src/grade-core.js"></script>
  <script src="../src/shared.js"></script>
  <script src="../src/icons.js"></script>
  <script src="../src/accents.js"></script>
  <script src="popup.js"></script>
</body>
</html>
